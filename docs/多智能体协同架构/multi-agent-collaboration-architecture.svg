<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">多智能体协同架构图</title>
  <desc id="desc">展示 Transport、POI、Weather、Hotel、Planner、Budget 各智能体通过共享状态 TripState 协同工作的输入、输出、并发数据收集、预算校验、重规划、异常重试和降级流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#dc2626"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 34px "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #475569; }
      .section { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.8; rx: 14; }
      .section-title { font: 700 20px "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #1e293b; }
      .state { fill: #fff7ed; stroke: #f97316; stroke-width: 3; rx: 18; }
      .state-title { font: 700 26px "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #9a3412; }
      .state-text { font: 500 16px "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #431407; }
      .agent { fill: #ffffff; stroke: #2563eb; stroke-width: 2.4; rx: 12; }
      .agent.parallel { stroke: #0891b2; }
      .agent.plan { stroke: #7c3aed; }
      .agent.budget { stroke: #16a34a; }
      .agent-title { font: 700 20px "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #0f172a; }
      .agent-label { font: 700 14px Arial, "Microsoft YaHei", sans-serif; fill: #475569; }
      .agent-text { font: 500 15px "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #334155; }
      .router { fill: #fef2f2; stroke: #dc2626; stroke-width: 2.2; rx: 12; }
      .router-title { font: 700 18px "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #991b1b; }
      .small { font: 500 14px "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #475569; }
      .line { fill: none; stroke: #334155; stroke-width: 2.1; marker-end: url(#arrow); }
      .line-blue { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrowBlue); }
      .line-green { fill: none; stroke: #16a34a; stroke-width: 2.2; marker-end: url(#arrowGreen); }
      .line-red { fill: none; stroke: #dc2626; stroke-width: 2.2; stroke-dasharray: 8 6; marker-end: url(#arrowRed); }
      .line-dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .label { font: 600 14px "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #334155; }
      .blue-label { font: 600 14px "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #1d4ed8; }
      .green-label { font: 600 14px "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #15803d; }
      .red-label { font: 600 14px "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #b91c1c; }
    </style>
  </defs>

  <rect class="bg" width="1500" height="980"/>
  <text class="title" x="750" y="55" text-anchor="middle">多智能体协同架构图</text>
  <text class="subtitle" x="750" y="86" text-anchor="middle">各 Agent 不直接相互调用，通过共享状态 TripState 读写字段完成协作、重试、预算校验与重规划</text>

  <!-- Input and final output -->
  <rect class="section" x="60" y="118" width="245" height="150"/>
  <text class="section-title" x="85" y="152">用户输入</text>
  <text class="small" x="85" y="184">目的地、日期、人数</text>
  <text class="small" x="85" y="209">预算、偏好、出发地</text>
  <text class="small" x="85" y="234">交通方式约束</text>

  <rect class="section" x="1190" y="735" width="250" height="150"/>
  <text class="section-title" x="1215" y="769">最终输出</text>
  <text class="small" x="1215" y="801">可用旅游计划</text>
  <text class="small" x="1215" y="826">预算明细与节省建议</text>
  <text class="small" x="1215" y="851">地图、酒店、交通参考</text>

  <!-- Shared state -->
  <rect class="state" x="555" y="118" width="390" height="210"/>
  <text class="state-title" x="750" y="154" text-anchor="middle">TripState 共享状态</text>
  <text class="state-text" x="585" y="190">保存：用户输入、Agent 输出、错误信息</text>
  <text class="state-text" x="585" y="218">保存：预算结果、迭代次数、最终计划</text>
  <text class="state-text" x="585" y="246">机制：各 Agent 读取所需字段</text>
  <text class="state-text" x="585" y="274">机制：执行结果写回指定状态字段</text>
  <text class="state-text" x="585" y="302">目标：降低 Agent 间直接耦合</text>

  <path class="line-blue" d="M 305 193 C 390 185, 470 184, 555 190"/>
  <text class="blue-label" x="400" y="174">写入 user_input</text>

  <!-- Parallel data collection area -->
  <rect class="section" x="70" y="375" width="720" height="360"/>
  <text class="section-title" x="95" y="410">并发数据收集阶段</text>
  <text class="small" x="95" y="438">POI、Weather、Hotel、Transport 可并行执行；Transport 仅在填写出发地时执行</text>

  <!-- Agents -->
  <rect class="agent parallel" x="105" y="475" width="295" height="105"/>
  <text class="agent-title" x="128" y="505">POI Agent</text>
  <text class="agent-label" x="128" y="531">输入</text>
  <text class="agent-text" x="172" y="531">目的地、日期、偏好</text>
  <text class="agent-label" x="128" y="556">输出</text>
  <text class="agent-text" x="172" y="556">景点列表、开放信息、推荐游玩时长</text>

  <rect class="agent parallel" x="455" y="475" width="295" height="105"/>
  <text class="agent-title" x="478" y="505">Weather Agent</text>
  <text class="agent-label" x="478" y="531">输入</text>
  <text class="agent-text" x="522" y="531">目的地、日期</text>
  <text class="agent-label" x="478" y="556">输出</text>
  <text class="agent-text" x="522" y="556">天气预报、温度、出行提醒</text>

  <rect class="agent parallel" x="105" y="610" width="295" height="105"/>
  <text class="agent-title" x="128" y="640">Hotel Agent</text>
  <text class="agent-label" x="128" y="666">输入</text>
  <text class="agent-text" x="172" y="666">目的地、日期、人数、预算</text>
  <text class="agent-label" x="128" y="691">输出</text>
  <text class="agent-text" x="172" y="691">酒店候选、价格、位置</text>

  <rect class="agent parallel" x="455" y="610" width="295" height="105"/>
  <text class="agent-title" x="478" y="640">Transport Agent</text>
  <text class="agent-label" x="478" y="666">输入</text>
  <text class="agent-text" x="522" y="666">出发地、目的地、日期、交通方式</text>
  <text class="agent-label" x="478" y="691">输出</text>
  <text class="agent-text" x="522" y="691">路线、耗时、票价或交通成本</text>

  <!-- State to data agents read/write lines -->
  <path class="line-dash" d="M 610 328 C 500 370, 338 415, 254 475"/>
  <path class="line-dash" d="M 704 328 C 675 380, 631 424, 603 475"/>
  <path class="line-dash" d="M 615 328 C 500 430, 345 535, 254 610"/>
  <path class="line-dash" d="M 790 328 C 745 430, 678 535, 603 610"/>
  <text class="label" x="455" y="373">读取所需字段</text>

  <path class="line-blue" d="M 400 528 C 500 500, 560 410, 625 328"/>
  <path class="line-blue" d="M 603 475 C 660 420, 696 375, 722 328"/>
  <path class="line-blue" d="M 400 662 C 530 585, 612 460, 685 328"/>
  <path class="line-blue" d="M 603 610 C 700 510, 766 415, 827 328"/>
  <text class="blue-label" x="500" y="598">写回 poi / weather / hotel / transport 结果</text>

  <!-- Planner and Budget -->
  <rect class="section" x="865" y="375" width="565" height="360"/>
  <text class="section-title" x="890" y="410">计划生成与预算校验阶段</text>

  <rect class="agent plan" x="910" y="470" width="235" height="125"/>
  <text class="agent-title" x="933" y="500">Planner Agent</text>
  <text class="agent-label" x="933" y="526">输入</text>
  <text class="agent-text" x="977" y="526">多 Agent 输出、偏好、日期</text>
  <text class="agent-text" x="977" y="550">人数、预算、交通信息</text>
  <text class="agent-label" x="933" y="575">输出</text>
  <text class="agent-text" x="977" y="575">初步计划 / 重规划结果</text>

  <rect class="agent budget" x="1170" y="470" width="220" height="125"/>
  <text class="agent-title" x="1193" y="500">Budget Agent</text>
  <text class="agent-label" x="1193" y="526">输入</text>
  <text class="agent-text" x="1237" y="526">行程计划、预算、人数</text>
  <text class="agent-label" x="1193" y="551">输出</text>
  <text class="agent-text" x="1237" y="551">预算验证结果</text>
  <text class="agent-text" x="1237" y="575">超预算金额、节省建议</text>

  <path class="line-dash" d="M 945 250 C 1012 305, 1026 391, 1027 470"/>
  <text class="label" x="1017" y="354">读取汇总状态</text>
  <path class="line-blue" d="M 1028 470 C 1010 392, 960 332, 878 328"/>
  <text class="blue-label" x="905" y="443">写回 initial_plan</text>

  <path class="line-green" d="M 1145 532 L 1170 532"/>
  <text class="green-label" x="1148" y="518">计划校验</text>
  <path class="line-blue" d="M 1280 470 C 1210 330, 1065 270, 945 260"/>
  <text class="blue-label" x="1232" y="350">写回 budget_result</text>

  <path class="line-green" d="M 1280 595 C 1290 642, 1304 690, 1315 735"/>
  <text class="green-label" x="1312" y="670">未超限</text>
  <path class="line-red" d="M 1170 575 C 1080 645, 965 645, 910 585"/>
  <text class="red-label" x="1026" y="664">超限：反馈节省建议并重规划</text>

  <!-- Router and exception handling -->
  <rect class="router" x="555" y="780" width="390" height="125"/>
  <text class="router-title" x="585" y="812">Workflow Router / 异常处理</text>
  <text class="small" x="585" y="842">读取 failed_agent、error_reason、retry_count</text>
  <text class="small" x="585" y="867">按失败标记单独重试对应数据收集 Agent</text>
  <text class="small" x="585" y="892">重试无效时触发 Planner 降级补全</text>

  <path class="line-red" d="M 605 715 C 620 748, 655 767, 705 780"/>
  <text class="red-label" x="465" y="762">异常写入 TripState</text>
  <path class="line-red" d="M 750 780 C 695 745, 650 724, 604 715"/>
  <path class="line-red" d="M 700 780 C 570 740, 408 700, 255 715"/>
  <path class="line-red" d="M 785 780 C 730 732, 665 712, 603 715"/>
  <text class="red-label" x="360" y="801">单 Agent 重试</text>

  <path class="line-dash" d="M 945 842 C 1030 785, 1028 660, 1028 595"/>
  <text class="label" x="1010" y="778">降级补全</text>

  <!-- Legend -->
  <rect class="section" x="70" y="790" width="360" height="115"/>
  <text class="section-title" x="95" y="823">图例</text>
  <line x1="100" y1="848" x2="170" y2="848" class="line-dash"/>
  <text class="small" x="190" y="853">读取 TripState 字段</text>
  <line x1="100" y1="875" x2="170" y2="875" class="line-blue"/>
  <text class="small" x="190" y="880">写回 TripState 字段</text>
  <line x1="100" y1="902" x2="170" y2="902" class="line-red"/>
  <text class="small" x="190" y="907">异常、重试或重规划路径</text>
</svg>
