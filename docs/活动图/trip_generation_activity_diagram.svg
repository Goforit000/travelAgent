<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1780" viewBox="0 0 1180 1780">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .title { font: 700 24px "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #1f2937; }
      .lane-title { font: 700 16px "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #111827; }
      .text { font: 14px "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #111827; }
      .small { font: 12px "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #374151; }
      .node { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; rx: 8; }
      .decision { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.6; }
      .terminal { fill: #111827; stroke: #111827; }
      .end-outer { fill: #ffffff; stroke: #111827; stroke-width: 2; }
      .lane { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1; }
      .lane-alt { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1; }
      .bar { fill: #111827; }
      .arrow { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .arrow-dash { stroke: #6b7280; stroke-width: 1.3; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .label { font: 12px "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #b45309; }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="1780" fill="#ffffff"/>
  <text x="590" y="42" text-anchor="middle" class="title">旅游计划生成活动图</text>

  <!-- Swimlanes -->
  <rect x="30" y="70" width="220" height="1660" class="lane"/>
  <rect x="250" y="70" width="220" height="1660" class="lane-alt"/>
  <rect x="470" y="70" width="220" height="1660" class="lane"/>
  <rect x="690" y="70" width="220" height="1660" class="lane-alt"/>
  <rect x="910" y="70" width="220" height="1660" class="lane"/>

  <line x1="30" y1="115" x2="1130" y2="115" stroke="#d1d5db"/>
  <text x="140" y="99" text-anchor="middle" class="lane-title">用户</text>
  <text x="360" y="99" text-anchor="middle" class="lane-title">前端系统</text>
  <text x="580" y="99" text-anchor="middle" class="lane-title">后端工作流</text>
  <text x="800" y="99" text-anchor="middle" class="lane-title">数据收集智能体</text>
  <text x="1020" y="99" text-anchor="middle" class="lane-title">规划与校验智能体</text>

  <!-- User lane -->
  <circle cx="140" cy="150" r="12" class="terminal"/>

  <rect x="65" y="190" width="150" height="54" class="node"/>
  <text x="140" y="213" text-anchor="middle" class="text">填写旅行信息</text>
  <text x="140" y="233" text-anchor="middle" class="small">目的地/日期/人数/预算</text>

  <rect x="65" y="290" width="150" height="48" class="node"/>
  <text x="140" y="320" text-anchor="middle" class="text">提交生成请求</text>

  <rect x="65" y="1548" width="150" height="48" class="node"/>
  <text x="140" y="1578" text-anchor="middle" class="text">查看旅游计划</text>

  <circle cx="140" cy="1655" r="16" class="end-outer"/>
  <circle cx="140" cy="1655" r="9" class="terminal"/>

  <!-- Frontend lane -->
  <rect x="285" y="375" width="150" height="48" class="node"/>
  <text x="360" y="405" text-anchor="middle" class="text">校验表单输入</text>

  <polygon points="360,470 430,515 360,560 290,515" class="decision"/>
  <text x="360" y="512" text-anchor="middle" class="text">表单是否合法</text>
  <text x="360" y="532" text-anchor="middle" class="small">?</text>

  <rect x="285" y="615" width="150" height="48" class="node"/>
  <text x="360" y="645" text-anchor="middle" class="text">发送生成请求</text>

  <rect x="285" y="790" width="150" height="62" class="node"/>
  <text x="360" y="814" text-anchor="middle" class="text">接收 SSE 事件</text>
  <text x="360" y="834" text-anchor="middle" class="small">实时显示执行状态</text>

  <rect x="285" y="1458" width="150" height="52" class="node"/>
  <text x="360" y="1480" text-anchor="middle" class="text">接收最终结果</text>
  <text x="360" y="1500" text-anchor="middle" class="small">展示行程页面</text>

  <!-- Backend lane -->
  <rect x="505" y="705" width="150" height="60" class="node"/>
  <text x="580" y="728" text-anchor="middle" class="text">接收请求</text>
  <text x="580" y="748" text-anchor="middle" class="small">构造 TripState</text>

  <rect x="505" y="825" width="150" height="54" class="node"/>
  <text x="580" y="848" text-anchor="middle" class="text">启动 LangGraph</text>
  <text x="580" y="868" text-anchor="middle" class="small">进入数据收集阶段</text>

  <rect x="500" y="1148" width="160" height="50" class="node"/>
  <text x="580" y="1178" text-anchor="middle" class="text">汇总多源数据</text>

  <polygon points="580,1238 665,1288 580,1338 495,1288" class="decision"/>
  <text x="580" y="1284" text-anchor="middle" class="text">是否存在异常</text>
  <text x="580" y="1304" text-anchor="middle" class="small">或空数据?</text>

  <rect x="505" y="1378" width="150" height="54" class="node"/>
  <text x="580" y="1401" text-anchor="middle" class="text">重试失败 Agent</text>
  <text x="580" y="1421" text-anchor="middle" class="small">或降级补全</text>

  <rect x="505" y="1532" width="150" height="56" class="node"/>
  <text x="580" y="1555" text-anchor="middle" class="text">finalize 解析</text>
  <text x="580" y="1575" text-anchor="middle" class="small">生成 TripPlan</text>

  <rect x="505" y="1628" width="150" height="54" class="node"/>
  <text x="580" y="1651" text-anchor="middle" class="text">保存历史记录</text>
  <text x="580" y="1671" text-anchor="middle" class="small">返回最终结果</text>

  <!-- Data collection lane -->
  <rect x="715" y="930" width="170" height="44" class="node"/>
  <text x="800" y="958" text-anchor="middle" class="text">POI Agent 搜索景点</text>

  <rect x="715" y="1000" width="170" height="44" class="node"/>
  <text x="800" y="1028" text-anchor="middle" class="text">Weather Agent 查天气</text>

  <rect x="715" y="1070" width="170" height="44" class="node"/>
  <text x="800" y="1098" text-anchor="middle" class="text">Hotel Agent 搜酒店</text>

  <polygon points="800,1145 885,1195 800,1245 715,1195" class="decision"/>
  <text x="800" y="1190" text-anchor="middle" class="text">是否填写</text>
  <text x="800" y="1210" text-anchor="middle" class="small">出发地?</text>

  <rect x="705" y="1282" width="190" height="58" class="node"/>
  <text x="800" y="1305" text-anchor="middle" class="text">Transport Agent</text>
  <text x="800" y="1325" text-anchor="middle" class="small">查询自驾/高铁/航班</text>

  <rect x="715" y="1378" width="170" height="44" class="node"/>
  <text x="800" y="1406" text-anchor="middle" class="text">跳过交通规划</text>

  <!-- Planner / Budget lane -->
  <rect x="935" y="1255" width="170" height="58" class="node"/>
  <text x="1020" y="1278" text-anchor="middle" class="text">Planner Agent</text>
  <text x="1020" y="1298" text-anchor="middle" class="small">生成结构化行程</text>

  <rect x="935" y="1360" width="170" height="58" class="node"/>
  <text x="1020" y="1383" text-anchor="middle" class="text">Budget Agent</text>
  <text x="1020" y="1403" text-anchor="middle" class="small">计算预算并校验</text>

  <polygon points="1020,1455 1110,1505 1020,1555 930,1505" class="decision"/>
  <text x="1020" y="1501" text-anchor="middle" class="text">预算是否超限</text>
  <text x="1020" y="1521" text-anchor="middle" class="small">?</text>

  <rect x="935" y="1605" width="170" height="58" class="node"/>
  <text x="1020" y="1628" text-anchor="middle" class="text">生成修改建议</text>
  <text x="1020" y="1648" text-anchor="middle" class="small">返回 Planner 重规划</text>

  <!-- Fork / Join bars -->
  <rect x="520" y="910" width="600" height="8" class="bar"/>
  <text x="590" y="900" class="small">Fork：并行数据收集</text>

  <rect x="520" y="1125" width="600" height="8" class="bar"/>
  <text x="590" y="1115" class="small">Join：基础数据收集完成</text>

  <!-- Main arrows -->
  <path d="M140 162 L140 190" class="arrow"/>
  <path d="M140 244 L140 290" class="arrow"/>
  <path d="M140 338 C140 355, 240 355, 285 395" class="arrow"/>
  <path d="M360 423 L360 470" class="arrow"/>
  <path d="M360 560 L360 615" class="arrow"/>
  <text x="374" y="590" class="label">[合法]</text>

  <path d="M290 515 C210 515, 210 215, 215 215" class="arrow"/>
  <text x="223" y="500" class="label">[不合法]</text>

  <path d="M435 639 C475 639, 505 690, 540 705" class="arrow"/>
  <path d="M580 765 L580 825" class="arrow"/>
  <path d="M580 879 L580 910" class="arrow"/>

  <!-- SSE dashed arrows -->
  <path d="M505 850 C455 850, 435 820, 435 820" class="arrow-dash"/>
  <text x="442" y="804" class="small">推送进度事件</text>

  <!-- Fork branches -->
  <path d="M800 918 L800 930" class="arrow"/>
  <path d="M800 974 L800 1000" class="arrow"/>
  <path d="M800 1044 L800 1070" class="arrow"/>
  <path d="M800 1114 L800 1145" class="arrow"/>

  <path d="M885 1195 C920 1195, 920 1311, 895 1311" class="arrow"/>
  <text x="900" y="1235" class="label">[已填写]</text>

  <path d="M800 1245 L800 1282" class="arrow"/>
  <path d="M715 1195 C680 1195, 680 1400, 715 1400" class="arrow"/>
  <text x="680" y="1235" class="label">[未填写]</text>

  <path d="M800 974 C800 1060, 650 1060, 650 1125" class="arrow"/>
  <path d="M800 1044 C800 1085, 700 1085, 700 1125" class="arrow"/>
  <path d="M800 1114 C800 1120, 760 1120, 760 1125" class="arrow"/>
  <path d="M800 1340 C800 1370, 835 1370, 835 1125" class="arrow"/>
  <path d="M800 1422 C800 1450, 870 1450, 870 1125" class="arrow"/>

  <!-- Join to backend -->
  <path d="M580 1133 L580 1148" class="arrow"/>
  <path d="M580 1198 L580 1238" class="arrow"/>

  <path d="M665 1288 C700 1288, 700 1405, 655 1405" class="arrow"/>
  <text x="674" y="1320" class="label">[是]</text>
  <path d="M580 1432 C580 1460, 780 1460, 935 1284" class="arrow"/>

  <path d="M930 1288 C835 1288, 760 1288, 665 1288" class="arrow"/>
  <text x="674" y="1264" class="label">[否]</text>
  <path d="M665 1288 C760 1288, 835 1288, 935 1284" class="arrow"/>

  <!-- Planner budget flow -->
  <path d="M1020 1313 L1020 1360" class="arrow"/>
  <path d="M1020 1418 L1020 1455" class="arrow"/>

  <path d="M930 1505 C820 1505, 710 1505, 655 1560" class="arrow"/>
  <text x="862" y="1488" class="label">[未超限]</text>

  <path d="M1020 1555 L1020 1605" class="arrow"/>
  <text x="1032" y="1583" class="label">[超限且次数&lt;上限]</text>
  <path d="M935 1634 C860 1634, 860 1240, 935 1284" class="arrow"/>

  <path d="M1110 1505 C1140 1505, 1140 1560, 655 1560" class="arrow"/>
  <text x="1037" y="1480" class="label">[超限且达到上限]</text>

  <!-- Final result flow -->
  <path d="M580 1588 L580 1628" class="arrow"/>
  <path d="M505 1655 C455 1655, 410 1510, 435 1484" class="arrow"/>
  <path d="M285 1484 C235 1484, 215 1572, 215 1572" class="arrow"/>
  <path d="M140 1596 L140 1639" class="arrow"/>

  <!-- Notes -->
  <rect x="45" y="1705" width="1080" height="44" fill="#eff6ff" stroke="#bfdbfe" rx="8"/>
  <text x="585" y="1732" text-anchor="middle" class="small">
    注：该活动图用于需求分析阶段，展示粗粒度业务活动、并行线程、条件分支和预算反馈循环；具体工具调用细节可在系统实现章节展开。
  </text>
</svg>
